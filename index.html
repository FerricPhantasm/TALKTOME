const queryInput = document.getElementById("query");
const errorBox = document.getElementById("error");
const resultBox = document.getElementById("result");
const messageBox = document.getElementById("message");

function normalize(value) {
  return value.trim().toLocaleLowerCase().replace(/\s+/g, " ");
}

const lookup = new Map();
for (const record of records) {
  for (const alias of record.aliases) {
    lookup.set(normalize(alias), record);
  }
}

function searchArchive() {
  const query = normalize(queryInput.value);
  const record = lookup.get(query);

  resultBox.style.display = "none";
  errorBox.style.display = "none";
  messageBox.replaceChildren();

  if (!query || !record) {
    errorBox.style.display = "block";
    return;
  }

  if (record.type === "image") {
    const slot = document.createElement("div");
    slot.className = "image-slot";

    const img = document.createElement("img");
    // Put the matching image in an "images" folder beside this HTML file.
    // Nadir: images/nadir.png
    // Vivisection: images/vivisection.png
    const filename = normalize(record.aliases[0]) === "nadir"
      ? "images/nadir.png"
      : "images/vivisection.png";
    img.src = filename;
    img.alt = record.aliases[0] + " archive image";
    img.onerror = () => {
      slot.textContent = "IMAGE SLOT // Add your image at: " + filename;
    };
    slot.appendChild(img);
    messageBox.appendChild(slot);
  } else {
    messageBox.textContent = record.message;
  }

  resultBox.style.display = "block";
}

document.getElementById("submit").addEventListener("click", searchArchive);
queryInput.addEventListener("keydown", event => {
  if (event.key === "Enter") searchArchive();
});
